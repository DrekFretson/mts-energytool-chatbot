<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МТС EnergyTool: консультант</title>
<style>
  body { font: 16px/1.45 system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1d2023; }
  main { max-width: 720px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; background: #fff; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid #e2e4e8; }
  header h1 { font-size: 17px; margin: 0; flex: 1 1 auto; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #log { scrollbar-width: none; -ms-overflow-style: none; }
  #log::-webkit-scrollbar { display: none; }
  .msg { position: relative; overflow-wrap: anywhere; width: fit-content; padding: 9px 13px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; }
  .msg-time-spacer { display: inline-block; width: 32px; height: 0; }
  .msg-time { position: absolute; right: 13px; bottom: 7px; color: #5a626b; font-size: 11px; line-height: 1.2; white-space: nowrap; }
  .user { align-self: flex-end; background: #e30611; color: #fff; }
  .user .msg-time { color: #fff; }
  .assistant { align-self: flex-start; background: #eef0f3; }
  .manager { align-self: flex-start; background: #fff1f1; border: 1px solid #e30611; }
  .system-event { align-self: center; color: #626b75; font-size: 13px; text-align: center; }
  .waiting { padding: 0; border-radius: 0; background: transparent; color: #4d5560; font-style: italic; }
  #suggestions { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; max-width: 100%; }
  #suggestions button {
    min-height: 40px;
    padding: 8px 14px;
    border: 1px solid #e30611;
    border-radius: 16px;
    background: #fff;
    color: #97000a;
    text-align: left;
    transition: background-color 140ms ease, border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
  }
  #suggestions button:hover,
  #suggestions button:focus-visible {
    border-color: #b0000d;
    background: #fff4f4;
    box-shadow: 0 0 0 2px rgb(227 6 17 / 16%);
  }
  #suggestions button:hover { transform: translateY(-1px); }
  #suggestions button:focus-visible { outline: 2px solid #b0000d; outline-offset: 2px; }
  #suggestions button:active { background: #ffe8e9; transform: translateY(0); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; max-width: 85%; margin-top: -4px; }
  .links a { padding: 5px 12px; border: 1px solid #c6cbd2; border-radius: 16px; background: #fff; color: #97000a; font-size: 14px; text-decoration: none; }
  .links a::after { content: " ↗"; }
  .links a:hover, .links a:focus-visible { border-color: #b0000d; background: #fff4f4; }
  .links a:focus-visible { outline: 2px solid #b0000d; outline-offset: 2px; }
  #close-chat { display: none; min-width: 36px; font-size: 20px; line-height: 1; padding: 4px 10px; }
  body.embed { background: #fff; }
  body.embed main { max-width: none; }
  body.embed header { padding: 8px 10px; gap: 6px; }
  body.embed header h1 { font-size: 15px; }
  body.embed header button { padding: 6px 8px; font-size: 13px; }
  body.embed:not(.with-debug) .debug-toggle { display: none; }
  body.embed #close-chat { display: inline-block; }
  body.embed .send-action { flex-basis: 96px; width: 96px; }
  .debug { align-self: flex-start; font-size: 12.5px; color: #4d5560; border-left: 3px solid #c6cbd2; padding-left: 8px; white-space: pre-wrap; }
  form.send { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #e2e4e8; }
  form.send input { flex: 1; }
  .send-action { box-sizing: border-box; flex: 0 0 112px; width: 112px; white-space: nowrap; }
  input, button { font: inherit; padding: 8px 12px; border: 1px solid #c6cbd2; border-radius: 8px; background: #fff; }
  button { cursor: pointer; }
  button.primary { background: #e30611; border-color: #e30611; color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  dialog { box-sizing: border-box; width: min(420px, calc(100vw - 32px)); min-width: 0; border: 1px solid #c6cbd2; border-radius: 12px; max-width: 420px; }
  dialog form { display: flex; flex-direction: column; gap: 10px; width: 100%; min-width: 0; }
  dialog label { display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
  dialog label.check { flex-direction: row; align-items: flex-start; gap: 8px; }
  .error { color: #b00020; font-size: 14px; min-height: 1em; }
  .field-error { max-width: 100%; color: #b00020; font-size: 13px; min-height: 1.2em; overflow-wrap: anywhere; }
  .field-error:empty { display: none; }
  .field-hint { color: #4d5560; font-size: 13px; }
  #lead-form input[aria-invalid="true"]:not(#lead-phone) { border-color: #b00020; box-shadow: 0 0 0 1px #b00020; }
  .phone-input { display: flex; align-items: center; min-width: 0; border: 1px solid #c6cbd2; border-radius: 8px; background: #fff; }
  .phone-prefix { padding: 8px 0 8px 12px; color: inherit; font: inherit; white-space: nowrap; }
  .phone-input input { min-width: 0; width: 100%; flex: 1; border: 0; box-shadow: none; outline: none; }
  .phone-input:focus-within { outline: 2px solid #b0000d; outline-offset: 1px; }
  .phone-input[aria-invalid="true"] { border-color: #b00020; box-shadow: 0 0 0 1px #b00020; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Консультант EnergyTool</h1>
    <label class="debug-toggle"><input type="checkbox" id="debug"> Отладка</label>
    <button id="lead-open" type="button">Связаться с менеджером</button>
    <button id="reset" type="button">Новый диалог</button>
    <button id="close-chat" type="button" aria-label="Свернуть чат">×</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form class="send" id="send">
    <input id="text" maxlength="2000" required autocomplete="off" aria-label="Сообщение" placeholder="Опишите вашу задачу">
    <button class="primary send-action" id="submit">Отправить</button>
    <button class="primary send-action" id="cancel" type="button" hidden>Отмена</button>
  </form>
</main>

<dialog id="lead">
  <form id="lead-form" novalidate>
    <strong>Заявка менеджеру</strong>
    <label>ФИО
      <input id="lead-name" name="name" required minlength="2" maxlength="200" aria-invalid="false" aria-describedby="name-error">
      <span class="field-error" id="name-error" aria-live="polite"></span>
    </label>
    <label>Телефон
      <span id="lead-phone-control" class="phone-input" aria-invalid="false">
        <span class="phone-prefix" aria-hidden="true">+7</span>
        <input id="lead-phone" name="phone" required type="tel" inputmode="numeric" maxlength="13" placeholder="900 000-00-00" aria-label="Телефон, 10 цифр после кода +7" aria-invalid="false" aria-describedby="phone-hint phone-error">
      </span>
      <span class="field-hint" id="phone-hint">Введите номер в формате +7 900 000-00-00</span>
      <span class="field-error" id="phone-error" aria-live="polite"></span>
    </label>
    <label>Компания
      <input id="lead-company" name="company" required maxlength="200" aria-invalid="false" aria-describedby="company-error">
      <span class="field-error" id="company-error" aria-live="polite"></span>
    </label>
    <label class="check"><input id="lead-consent" name="consent" type="checkbox" required aria-invalid="false" aria-describedby="consent-error"> <span>Согласен на обработку персональных данных</span></label>
    <span class="field-error" id="consent-error" aria-live="polite"></span>
    <div class="error" id="lead-error" role="alert"></div>
    <button class="primary" id="lead-submit" type="submit">Отправить заявку</button>
    <button type="button" id="lead-close">Отмена</button>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const QUICK_PROMPTS = [
  "Выросли счета за свет — как снизить?",
  "Как наладить учёт на нескольких объектах?",
  "Нужны счётчики в СНТ",
  "Как найти хищения электроэнергии?",
];
const ACTIVE_CHAT_STORAGE_KEY = "mts-energytool-active-chat-v1";
let sessionId = null;
let chatEntries = [];
let activeRequestId = 0;
let activeMessageController = null;
let waitingDotsTimer = null;
let waitingMessage = null;
let streamBubble = null;
let managerPollTimer = null;
let managerMessageIds = new Set();

function persistActiveChat() {
  if (!sessionId) return;
  try {
    sessionStorage.setItem(ACTIVE_CHAT_STORAGE_KEY, JSON.stringify({ sessionId, entries: chatEntries, managerMessageIds: [...managerMessageIds] }));
  } catch {
    // Storage can be disabled or full; the chat itself should continue working.
  }
}

function readActiveChat() {
  try {
    const saved = JSON.parse(sessionStorage.getItem(ACTIVE_CHAT_STORAGE_KEY) || "null");
    if (!saved || typeof saved.sessionId !== "string" || !saved.sessionId || !Array.isArray(saved.entries)) return null;
    const entries = saved.entries.filter((entry) => entry &&
      ["user", "assistant", "manager", "system"].includes(entry.role) && typeof entry.text === "string")
      .map((entry) => ({
        role: entry.role,
        text: entry.text,
        createdAt: Number.isFinite(entry.createdAt) ? entry.createdAt : Date.now(),
        links: safeLinks(entry.links),
      }));
    return { sessionId: saved.sessionId, entries, managerMessageIds: Array.isArray(saved.managerMessageIds) ? saved.managerMessageIds : [] };
  } catch {
    return null;
  }
}

function clearWaiting() {
  clearInterval(waitingDotsTimer);
  waitingDotsTimer = null;
  waitingMessage?.remove();
  waitingMessage = null;
}

function clearStream() {
  streamBubble?.node.remove();
  streamBubble = null;
}

function cancelOnServer() {
  // Сервер останавливает генерацию и убирает реплику без ответа из истории; сбой этого запроса клиенту не важен.
  if (sessionId) fetch(`/api/sessions/${encodeURIComponent(sessionId)}/cancel`, { method: "POST" }).catch(() => {});
}

function showWaiting(phrase, requestId) {
  if (!waitingMessage) {
    waitingMessage = document.createElement("div");
    waitingMessage.className = "msg assistant waiting";
    waitingMessage.setAttribute("role", "status");
    waitingMessage.setAttribute("aria-live", "polite");
    $("log").append(waitingMessage);
    waitingMessage.scrollIntoView({ block: "nearest" });
  }
  clearInterval(waitingDotsTimer);
  let dot = 0;
  const dots = [".", "..", "..."];
  const update = () => {
    if (!waitingMessage || requestId !== activeRequestId) return;
    waitingMessage.textContent = `${phrase}${dots[dot]}`;
    dot = (dot + 1) % dots.length;
  };
  update();
  waitingDotsTimer = setInterval(update, 600);
}

function safeLinks(links) {
  return (Array.isArray(links) ? links : []).filter((link) => link && typeof link.label === "string" &&
    typeof link.url === "string" && link.url.startsWith("https://")).slice(0, 2);
}

function addLinks(links) {
  const shown = safeLinks(links);
  if (!shown.length) return;
  const row = document.createElement("div");
  row.className = "links";
  row.setAttribute("role", "group");
  row.setAttribute("aria-label", "Страницы сайта по теме ответа");
  shown.forEach((link) => {
    const anchor = document.createElement("a");
    anchor.href = link.url;
    anchor.target = "_blank";
    anchor.rel = "noopener noreferrer";
    anchor.textContent = link.label;
    anchor.setAttribute("aria-label", `${link.label} (откроется в новой вкладке)`);
    row.append(anchor);
  });
  $("log").append(row);
  row.scrollIntoView({ block: "nearest" });
}

function addSystemEvent(text) {
  const event = document.createElement("div");
  event.className = "system-event";
  event.textContent = `— ${text} —`;
  $("log").append(event);
  event.scrollIntoView({ block: "nearest" });
}

function appendMessageTime(node, timestamp) {
  const date = new Date(timestamp);
  const spacer = document.createElement("span");
  spacer.className = "msg-time-spacer";
  spacer.setAttribute("aria-hidden", "true");
  const time = document.createElement("time");
  time.className = "msg-time";
  time.dateTime = date.toISOString();
  time.textContent = date.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  node.append(spacer, time);
}

function startManagerPolling() {
  clearInterval(managerPollTimer);
  const poll = async () => {
    if (!sessionId || document.hidden) return;
    const requestedSession = sessionId;
    try {
      const response = await fetch(`/api/sessions/${encodeURIComponent(requestedSession)}/manager-messages`);
      if (!response.ok || requestedSession !== sessionId) return;
      for (const message of await response.json()) {
        if (managerMessageIds.has(message.id)) continue;
        managerMessageIds.add(message.id);
        if (message.role === "system") {
          addSystemEvent(message.content);
        } else add("manager", message.content, false, message.created_at * 1000);
        const entry = { role: message.role, text: message.content, createdAt: message.created_at * 1000, serverId: message.id };
        chatEntries.push(entry);
        persistActiveChat();
      }
    } catch { /* Повторим при следующем цикле опроса. */ }
  };
  poll();
  managerPollTimer = setInterval(poll, 2500);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) startManagerPolling(); });

function fitMessageBubble(node, content) {
  node.style.width = "";
  const range = document.createRange();
  range.selectNodeContents(content);
  const lines = Array.from(range.getClientRects())
    .filter((rect) => rect.width > 0);
  const widestLine = lines.reduce((width, rect) => Math.max(width, rect.width), 0);
  const lastLine = lines.length ? lines[lines.length - 1].width : 0;
  node.style.width = `${Math.ceil(Math.max(widestLine, lastLine + 32))}px`;
}

window.addEventListener("resize", () => {
  document.querySelectorAll("#log .msg-content").forEach((content) => {
    fitMessageBubble(content.parentElement, content);
  });
});

function add(role, text, persist = true, createdAt = Date.now(), links = []) {
  const node = document.createElement("div");
  node.className = "msg " + role;
  const content = document.createElement("span");
  content.className = "msg-content";
  content.textContent = text;
  node.append(content);
  appendMessageTime(node, createdAt);
  $("log").append(node);
  fitMessageBubble(node, content);
  node.scrollIntoView();
  if (persist && (role === "user" || role === "assistant")) {
    chatEntries.push({ role, text: String(text), createdAt, links: safeLinks(links) });
    persistActiveChat();
  }
  addLinks(links);
}

function appendToStream(piece) {
  if (!streamBubble) {
    const node = document.createElement("div");
    node.className = "msg assistant";
    // Читалка экрана получает ответ целиком в конце, а не по куску.
    node.setAttribute("aria-live", "off");
    const content = document.createElement("span");
    content.className = "msg-content";
    node.append(content);
    $("log").append(node);
    streamBubble = { node, content };
  }
  streamBubble.content.textContent += piece;
  streamBubble.node.scrollIntoView({ block: "nearest" });
}

function finishStream(text, links) {
  // Показанные куски заменяются готовым сообщением: читалка экрана объявляет ответ один раз и целиком.
  clearStream();
  add("assistant", text, true, Date.now(), links);
}

function addDebug(debug) {
  const node = document.createElement("div");
  node.className = "debug";
  const timings = debug.timings || {};
  const seconds = (ms) => `${(ms / 1000).toFixed(1)} с`;
  const parts = [["поиск", timings.search_ms], ["модель", timings.llm_ms], ["до первого слова", timings.first_token_ms]]
    .filter(([, ms]) => Number.isFinite(ms)).map(([name, ms]) => `${name} ${seconds(ms)}`);
  const lines = [Number.isFinite(timings.total_ms) ? `Время ответа: ${seconds(timings.total_ms)} (${parts.join(", ")})` : "Время ответа: нет данных"];
  const documents = new Map();
  (debug.sources || []).forEach((source) => {
    const entry = documents.get(source.file) || { title: String(source.crumb).split(" > ")[0], sections: 0 };
    entry.sections += 1;
    documents.set(source.file, entry);
  });
  const shown = [...documents].slice(0, 8);
  lines.push(`Документы базы знаний в ответе: ${documents.size}`);
  shown.forEach(([file, entry], index) => lines.push(`${index + 1}. ${entry.title} (${file}), разделов: ${entry.sections}`));
  if (documents.size > shown.length) lines.push(`и ещё ${documents.size - shown.length}`);
  if (debug.route && debug.route !== "off") lines.push(`Маршрут реплики: ${debug.route}`);
  if ((debug.links || []).length) lines.push(`Ссылки на сайт: ${debug.links.map((link) => link.label).join(", ")}`);
  const unverified = (debug.unverified_numbers || []).join(", ");
  if (unverified) lines.push(`Числа не из базы: ${unverified}`);
  if (debug.degraded) lines.push("Ответ-заглушка: сбой LLM");
  node.textContent = lines.join("\n");
  $("log").append(node);
  node.scrollIntoView();
}

function showWelcome() {
  add("assistant", "Здравствуйте! Расскажите, какую задачу хотите решить: снизить расходы на электроэнергию, наладить учёт, найти потери или что-то ещё?", false);
  const suggestions = document.createElement("div");
  suggestions.id = "suggestions";
  suggestions.setAttribute("role", "group");
  suggestions.setAttribute("aria-label", "Примеры вопросов консультанту");
  QUICK_PROMPTS.forEach((prompt) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = prompt;
    button.addEventListener("click", () => {
      $("text").value = prompt;
      $("send").requestSubmit();
    });
    suggestions.append(button);
  });
  $("log").append(suggestions);
}

async function api(path, body, headers = {}, signal) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...headers },
    body: JSON.stringify(body ?? {}),
    signal,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(typeof data.detail === "string" ? data.detail : "Проверьте введённые данные");
    error.status = response.status;
    throw error;
  }
  return data;
}

async function streamMessage(path, body, headers, signal, onEvent) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...headers },
    body: JSON.stringify(body),
    signal,
  });
  if (!response.ok) {
    const data = await response.json().catch(() => ({}));
    const error = new Error(typeof data.detail === "string" ? data.detail : "Проверьте введённые данные");
    error.status = response.status;
    throw error;
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let done = null;
  for (;;) {
    const chunk = await reader.read();
    buffer += decoder.decode(chunk.value || new Uint8Array(), { stream: !chunk.done });
    const blocks = buffer.split("\n\n");
    buffer = blocks.pop();
    for (const block of blocks) {
      const event = /^event: (.+)$/m.exec(block);
      const data = /^data: (.+)$/m.exec(block);
      if (!event || !data) continue;
      const payload = JSON.parse(data[1]);
      if (event[1] === "done") done = payload;
      else onEvent(event[1], payload);
    }
    if (chunk.done) break;
  }
  if (!done) throw new Error("Поток ответа оборвался");
  return done;
}

async function newDialog(restoreLast = false) {
  clearInterval(managerPollTimer);
  managerPollTimer = null;
  const dialogRequestId = ++activeRequestId;
  if (activeMessageController) {
    activeMessageController.abort();
    cancelOnServer();
  }
  activeMessageController = null;
  clearWaiting();
  clearStream();
  $("cancel").hidden = true;
  $("cancel").disabled = false;
  $("submit").hidden = false;
  sessionId = null;
  chatEntries = [];
  $("submit").disabled = true;
  $("log").replaceChildren();
  try {
    const saved = restoreLast ? readActiveChat() : null;
    if (saved) {
      sessionId = saved.sessionId;
      chatEntries = saved.entries;
      managerMessageIds = new Set(saved.managerMessageIds);
      chatEntries.forEach((entry) => {
        if (entry.role === "system") {
          addSystemEvent(entry.text);
        } else add(entry.role, entry.text, false, entry.createdAt, entry.links);
      });
      if (!chatEntries.some((entry) => entry.role === "user")) showWelcome();
      persistActiveChat();
      startManagerPolling();
      return;
    }

    const createdSessionId = (await api("/api/sessions")).id;
    if (dialogRequestId !== activeRequestId) return;
    sessionId = createdSessionId;
    managerMessageIds = new Set();
    persistActiveChat();
    showWelcome();
    startManagerPolling();
  } finally {
    if (dialogRequestId === activeRequestId) $("submit").disabled = false;
  }
}

function debugFailed(message) {
  delete sessionStorage.debugToken;
  $("debug").checked = false;
  add("debug", `${message}. Отметьте «Отладка» ещё раз, чтобы ввести токен.`);
}

$("debug").addEventListener("change", (event) => {
  if (event.target.checked && !sessionStorage.debugToken) {
    sessionStorage.debugToken = prompt("Токен отладки") || "";
    event.target.checked = Boolean(sessionStorage.debugToken);
  }
});

$("send").addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = $("text").value.trim();
  if (!text || !sessionId || activeMessageController) return;
  const requestId = ++activeRequestId;
  const controller = new AbortController();
  activeMessageController = controller;
  clearWaiting();
  clearStream();
  $("suggestions")?.remove();
  $("text").value = "";
  $("submit").hidden = true;
  $("cancel").hidden = false;
  add("user", text);
  showWaiting("Ищу в материалах", requestId);
  try {
    const headers = $("debug").checked ? { "X-Debug-Token": sessionStorage.debugToken } : {};
    const reply = await streamMessage(`/api/sessions/${sessionId}/messages/stream`, { text }, headers, controller.signal, (kind, data) => {
      if (requestId !== activeRequestId) return;
      if (kind === "status") showWaiting(data.stage === "thinking" ? "Обдумываю ответ" : "Готовлю ответ", requestId);
      if (kind === "delta") {
        clearWaiting();
        appendToStream(data.text);
      }
    });
    if (requestId !== activeRequestId) return;
    clearWaiting();
    if (reply.manager_active) {
      addSystemEvent("Сообщение передано менеджеру");
      return;
    }
    finishStream(reply.text, reply.links);
    if (reply.debug) addDebug(reply.debug);
    if (reply.debug_error) debugFailed(reply.debug_error);
    if (reply.open_form) $("lead").showModal();
    if (reply.offer_lead) add("assistant", "Если хотите, передам ваш запрос менеджеру с резюме диалога: нажмите «Связаться с менеджером».");
  } catch (error) {
    if (requestId === activeRequestId && error.name !== "AbortError") {
      clearWaiting();
      clearStream();
      if (error.status === 404) {
        // Сервер не знает сохранённый диалог (например, базу очистили): начинаем новый, а не отвечаем ошибкой на каждую реплику.
        await newDialog(false);
        add("assistant", "Прошлый диалог больше недоступен, я начал новый. Повторите, пожалуйста, вопрос.", false);
        return;
      }
      add("assistant", error.status === 429 || error.status === 413 ? error.message : "Не получилось ответить. Попробуйте ещё раз.", false);
    }
  } finally {
    if (requestId === activeRequestId) {
      activeMessageController = null;
      clearWaiting();
      $("submit").hidden = false;
      $("submit").disabled = false;
      $("cancel").hidden = true;
      $("text").focus();
    }
  }
});

$("cancel").addEventListener("click", () => {
  if (!activeMessageController) return;
  activeRequestId += 1;
  const controller = activeMessageController;
  activeMessageController = null;
  controller.abort();
  cancelOnServer();
  clearWaiting();
  clearStream();
  $("submit").hidden = false;
  $("submit").disabled = false;
  $("cancel").hidden = true;
  $("text").focus();
});

// Режим виджета: страница открыта во фрейме на сайте, кнопка и Esc сворачивают панель у родителя.
if (new URLSearchParams(location.search).has("embed")) {
  document.body.classList.add("embed");
  if (new URLSearchParams(location.search).has("debug")) document.body.classList.add("with-debug");
  const closeChat = () => parent.postMessage({ type: "energytool-chat-close" }, "*");
  $("close-chat").addEventListener("click", closeChat);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !$("lead").open) closeChat();
  });
  window.addEventListener("message", (event) => {
    if (event.source === parent && event.data?.type === "energytool-chat-open") $("text").focus();
  });
}

$("reset").addEventListener("click", () => newDialog(false));
const LEAD_FIELDS = [
  {
    input: "lead-name",
    error: "name-error",
    isValid: (value) => (value.trim().match(/\p{L}/gu) || []).length >= 2,
    errorText: "Введите ФИО — минимум 2 буквы",
  },
  {
    input: "lead-phone",
    error: "phone-error",
    isValid: (value) => {
      const digits = value.replace(/\D/g, "");
      return value.length <= 13 && digits.length === 10;
    },
    errorText: "Проверьте номер телефона",
  },
  {
    input: "lead-company",
    error: "company-error",
    isValid: (value) => value.trim().length > 0,
    errorText: "Укажите компанию",
  },
];
let leadValidationActive = false;
let leadSubmitting = false;

function setLeadFieldError(inputId, errorId, message) {
  $(inputId).setAttribute("aria-invalid", String(Boolean(message)));
  if (inputId === "lead-phone") $("lead-phone-control").setAttribute("aria-invalid", String(Boolean(message)));
  $(errorId).textContent = message;
}

function validateLeadField(field) {
  const valid = field.isValid($(field.input).value);
  setLeadFieldError(field.input, field.error, valid ? "" : field.errorText);
  return valid;
}

function validateLeadForm() {
  let firstInvalid = null;
  LEAD_FIELDS.forEach((field) => {
    if (!validateLeadField(field) && !firstInvalid) firstInvalid = $(field.input);
  });
  const consentValid = $("lead-consent").checked;
  setLeadFieldError("lead-consent", "consent-error", consentValid ? "" : "Подтвердите согласие на обработку персональных данных");
  if (!consentValid && !firstInvalid) firstInvalid = $("lead-consent");
  return firstInvalid;
}

function clearLeadErrors() {
  LEAD_FIELDS.forEach((field) => setLeadFieldError(field.input, field.error, ""));
  setLeadFieldError("lead-consent", "consent-error", "");
}

function formatPhoneInput(isPaste = false) {
  const input = $("lead-phone");
  const raw = input.value;
  const caret = input.selectionStart ?? raw.length;
  let digits = raw.replace(/\D/g, "");
  let digitsBeforeCaret = raw.slice(0, caret).replace(/\D/g, "").length;
  const hasExplicitCountryPrefix = /^\s*\+/.test(raw);

  if ((hasExplicitCountryPrefix || (isPaste && digits.length === 11)) && /^[78]/.test(digits)) {
    digits = digits.slice(1);
    if (hasExplicitCountryPrefix && digitsBeforeCaret > 0) digitsBeforeCaret -= 1;
  }
  digits = digits.slice(0, 10);
  digitsBeforeCaret = Math.min(digitsBeforeCaret, digits.length);

  let formatted = digits.slice(0, 3);
  if (digits.length > 3) formatted += ` ${digits.slice(3, 6)}`;
  if (digits.length > 6) formatted += `-${digits.slice(6, 8)}`;
  if (digits.length > 8) formatted += `-${digits.slice(8, 10)}`;

  let formattedCaret = digitsBeforeCaret;
  let seenDigits = 0;
  for (let index = 0; index < formatted.length; index += 1) {
    if (/\d/.test(formatted[index])) seenDigits += 1;
    if (seenDigits === digitsBeforeCaret) {
      formattedCaret = index + 1;
      break;
    }
  }
  if (formatted[formattedCaret] === " " || formatted[formattedCaret] === "-") formattedCaret += 1;

  input.value = formatted;
  input.setSelectionRange(formattedCaret, formattedCaret);
  if (leadValidationActive) validateLeadField(LEAD_FIELDS[1]);
}

$("lead-phone").addEventListener("paste", (event) => {
  event.preventDefault();
  const input = $("lead-phone");
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? start;
  input.value = input.value.slice(0, start) + event.clipboardData.getData("text") + input.value.slice(end);
  input.setSelectionRange(input.value.length, input.value.length);
  formatPhoneInput(true);
});

LEAD_FIELDS.filter((field) => field.input !== "lead-phone").forEach((field) => $(field.input).addEventListener("input", () => {
  if (leadValidationActive) validateLeadField(field);
}));
$("lead-phone").addEventListener("input", () => formatPhoneInput());
$("lead-consent").addEventListener("change", () => {
  if (leadValidationActive) {
    const valid = $("lead-consent").checked;
    setLeadFieldError("lead-consent", "consent-error", valid ? "" : "Подтвердите согласие на обработку персональных данных");
  }
});

$("lead-open").addEventListener("click", () => {
  leadValidationActive = false;
  clearLeadErrors();
  $("lead-error").textContent = "";
  $("lead").showModal();
});
$("lead-close").addEventListener("click", () => $("lead").close());

$("lead-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (leadSubmitting) return;
  leadValidationActive = true;
  $("lead-error").textContent = "";
  const firstInvalid = validateLeadForm();
  if (firstInvalid) {
    firstInvalid.focus();
    return;
  }
  const button = $("lead-submit");
  leadSubmitting = true;
  button.disabled = true;
  button.setAttribute("aria-busy", "true");
  const form = new FormData(event.target);
  try {
    const result = await api(`/api/sessions/${sessionId}/lead`, {
      name: form.get("name"), phone: `+7 ${form.get("phone")}`, company: form.get("company"), consent: form.has("consent"),
    });
    $("lead").close();
    event.target.reset();
    clearLeadErrors();
    leadValidationActive = false;
    add("assistant", result.status === "created"
      ? `Заявка передана менеджеру. Он получит это резюме диалога:\n\n${result.summary}`
      : "Заявка по этому диалогу уже передана менеджеру.");
  } catch (error) {
    if (/телефон|номер/i.test(error.message)) {
      setLeadFieldError("lead-phone", "phone-error", error.message);
    } else if (/согласие/i.test(error.message)) {
      setLeadFieldError("lead-consent", "consent-error", error.message);
    } else {
      $("lead-error").textContent = error.message;
    }
  } finally {
    leadSubmitting = false;
    button.disabled = false;
    button.removeAttribute("aria-busy");
  }
});

newDialog(true);
</script>
</body>
</html>
