<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МТС EnergyTool: консультант</title>
<style>
  body { font: 16px/1.45 system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1d2023; }
  main { max-width: 720px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; background: #fff; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid #e2e4e8; }
  header h1 { font-size: 17px; margin: 0; flex: 1 1 auto; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 9px 13px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #e30611; color: #fff; }
  .assistant { align-self: flex-start; background: #eef0f3; }
  .typing { color: #6b7380; font-style: italic; }
  .debug { align-self: flex-start; font-size: 12.5px; color: #4d5560; border-left: 3px solid #c6cbd2; padding-left: 8px; white-space: pre-wrap; }
  form.send { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #e2e4e8; }
  form.send input { flex: 1; }
  input, button { font: inherit; padding: 8px 12px; border: 1px solid #c6cbd2; border-radius: 8px; background: #fff; }
  button { cursor: pointer; }
  button.primary { background: #e30611; border-color: #e30611; color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  dialog { border: 1px solid #c6cbd2; border-radius: 12px; max-width: 420px; }
  dialog form { display: flex; flex-direction: column; gap: 10px; }
  dialog label { display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
  dialog label.check { flex-direction: row; align-items: flex-start; gap: 8px; }
  .error { color: #b00020; font-size: 14px; min-height: 1em; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Консультант EnergyTool</h1>
    <label><input type="checkbox" id="debug"> Отладка</label>
    <button id="lead-open" type="button">Связаться с менеджером</button>
    <button id="reset" type="button">Новый диалог</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form class="send" id="send">
    <input id="text" maxlength="2000" required autocomplete="off" aria-label="Сообщение" placeholder="Опишите вашу задачу">
    <button class="primary" id="submit">Отправить</button>
  </form>
</main>

<dialog id="lead">
  <form id="lead-form">
    <strong>Заявка менеджеру</strong>
    <label>ФИО <input name="name" required minlength="2" maxlength="200"></label>
    <label>Телефон <input name="phone" required type="tel" maxlength="30" placeholder="+7 900 000-00-00"></label>
    <label>Компания <input name="company" required maxlength="200"></label>
    <label class="check"><input name="consent" type="checkbox" required> <span>Согласен на обработку персональных данных</span></label>
    <div class="error" id="lead-error" role="alert"></div>
    <button class="primary">Отправить заявку</button>
    <button type="button" id="lead-close">Отмена</button>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
let sessionId = null;

function add(role, text) {
  const node = document.createElement("div");
  node.className = "msg " + role;
  node.textContent = text;
  $("log").append(node);
  node.scrollIntoView();
  return node;
}

function addDebug(debug) {
  const node = document.createElement("div");
  node.className = "debug";
  const sources = (debug.sources || []).map((s) => `${s.score}  ${s.crumb} (${s.file})`).join("\n");
  const unverified = (debug.unverified_numbers || []).join(", ");
  node.textContent = `Время, мс: ${JSON.stringify(debug.timings)}\n${sources}` +
    (unverified ? `\nЧисла не из базы: ${unverified}` : "") + (debug.degraded ? "\nОтвет-заглушка: сбой LLM" : "");
  $("log").append(node);
  node.scrollIntoView();
}

async function api(path, body, headers = {}) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...headers },
    body: JSON.stringify(body ?? {}),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(typeof data.detail === "string" ? data.detail : "Проверьте введённые данные");
    error.status = response.status;
    throw error;
  }
  return data;
}

async function newDialog() {
  $("log").replaceChildren();
  sessionId = (await api("/api/sessions")).id;
  add("assistant", "Здравствуйте! Расскажите, какую задачу хотите решить: снизить расходы на электроэнергию, наладить учёт, найти потери или что-то ещё?");
}

function debugFailed(message) {
  delete sessionStorage.debugToken;
  $("debug").checked = false;
  add("debug", `${message}. Отметьте «Отладка» ещё раз, чтобы ввести токен.`);
}

$("debug").addEventListener("change", (event) => {
  if (event.target.checked && !sessionStorage.debugToken) {
    sessionStorage.debugToken = prompt("Токен отладки") || "";
    event.target.checked = Boolean(sessionStorage.debugToken);
  }
});

$("send").addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  $("submit").disabled = true;
  add("user", text);
  const typing = add("assistant typing", "Консультант печатает...");
  try {
    const headers = $("debug").checked ? { "X-Debug-Token": sessionStorage.debugToken } : {};
    const reply = await api(`/api/sessions/${sessionId}/messages`, { text }, headers);
    typing.remove();
    add("assistant", reply.text);
    if (reply.debug) addDebug(reply.debug);
    if (reply.debug_error) debugFailed(reply.debug_error);
    if (reply.open_form) $("lead").showModal();
    if (reply.offer_lead) add("assistant", "Если хотите, передам ваш запрос менеджеру с резюме диалога: нажмите «Связаться с менеджером».");
  } catch (error) {
    typing.remove();
    add("assistant", error.status === 429 || error.status === 413 ? error.message : "Не получилось ответить. Попробуйте ещё раз.");
  } finally {
    $("submit").disabled = false;
    $("text").focus();
  }
});

$("reset").addEventListener("click", newDialog);
$("lead-open").addEventListener("click", () => $("lead").showModal());
$("lead-close").addEventListener("click", () => $("lead").close());

$("lead-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = new FormData(event.target);
  $("lead-error").textContent = "";
  try {
    const result = await api(`/api/sessions/${sessionId}/lead`, {
      name: form.get("name"), phone: form.get("phone"), company: form.get("company"), consent: form.has("consent"),
    });
    $("lead").close();
    event.target.reset();
    add("assistant", result.status === "created"
      ? `Заявка передана менеджеру. Он получит это резюме диалога:\n\n${result.summary}`
      : "Заявка по этому диалогу уже передана менеджеру.");
  } catch (error) {
    $("lead-error").textContent = error.message;
  }
});

newDialog();
</script>
</body>
</html>
